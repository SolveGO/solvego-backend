spring:
  profiles:
    default: local

  cache:
    type: ${CACHE_TYPE:redis}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/solvego}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

jwt:
  expiration: 600000

springdoc:
  override-with-generic-response: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  explanation:
    free-daily-limit: ${AI_EXPLANATION_FREE_DAILY_LIMIT:5}
    pro-daily-limit: ${AI_EXPLANATION_PRO_DAILY_LIMIT:30}
    time-zone: ${AI_EXPLANATION_TIME_ZONE:Asia/Seoul}

auth:
  cookie:
    secure: false
    same-site: Lax
