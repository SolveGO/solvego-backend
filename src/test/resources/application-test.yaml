spring:
  cache:
    type: none

  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/solvego_test}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:root_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: off

jwt:
  secret: test-secret-key-test-secret-key-test-secret-key-123456